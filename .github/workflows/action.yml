name: Node.js Cron Jobs

on:
  schedule:
    - cron: "* * * * *" # Cron job setiap hari pukul 00:00 UTC

jobs:
  job1:
    runs-on: ubuntu-latest
    container: node:18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set Up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - run: npm install
      - run: ls -R
      - run: node cron/dailyCron.js
