name: Node.js Cron Jobs

on:
  schedule:
    - cron: "* * * * *" # Cron job setiap hari pukul 00:00 UTC

jobs:
  job1:
    runs-on: ubuntu-latest
    container: node:18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set Up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Print Directory Contents (Debug)
        run: ls -R

      - name: Run Job 1
        run: node cron/dailyCron.js
